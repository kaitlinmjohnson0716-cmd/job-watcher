name: daily
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: daily
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Fetch sources and build history
        run: uv run python -m jobwatcher.run
      - name: Open today's issue
        run: uv run python -m jobwatcher.issue
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Daily run $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase
          git push
